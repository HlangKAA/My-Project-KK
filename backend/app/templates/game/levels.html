<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select Level - The Lost Spectrum</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      .levels-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 2rem;
        max-width: 1200px;
        width: 100%;
        margin-top: 2rem;
      }

      .level-card {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        padding: 2rem;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .level-card:hover {
        transform: translateY(-5px);
        border-color: var(--primary-cyan);
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.5),
          0 0 20px rgba(34, 211, 238, 0.2);
      }
      .level-card.locked {
        opacity: 0.5;
        pointer-events: none;
        filter: grayscale(1);
        border-color: #333;
      }
      .level-card.locked:hover {
        transform: none;
        box-shadow: none;
      }

      .level-number {
        font-size: 0.9rem;
        color: var(--primary-cyan);
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 0.5rem;
      }

      .level-title {
        font-size: 1.5rem;
        margin-bottom: 1rem;
        color: #fff;
      }

      .level-desc {
        color: var(--text-muted);
        line-height: 1.6;
        margin-bottom: 2rem;
        flex-grow: 1;
      }

      .card-footer {
        margin-top: auto;
      }
    </style>
  </head>
  <body>
    <div
      style="
        padding: 40px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      "
    >
      <div class="text-center">
        <h1 class="brand-title">MISSION SELECT</h1>
        <p style="color: var(--text-muted)">CHOOSE YOUR CHALLENGE</p>
      </div>

      <div class="levels-grid">
        {% for id, level in levels.items() %}
        <div
          class="glass-panel level-card {% if id > current_level %}locked{% endif %}"
        >
          <div class="level-number">LEVEL {{ id }}</div>
          <h2 class="level-title">{{ level.title }}</h2>
          <div class="level-desc">
            <p style="color: #e2e8f0; font-weight: 500; margin-bottom: 0.5rem">
              {{ level.concept }}
            </p>
            <p style="font-size: 0.9rem">{{ level.objective }}</p>
          </div>

          <div class="card-footer">
            {% if id <= current_level %}
            <a
              href="{{ url_for('game.game_page', level_id=id) }}"
              class="btn-neon btn-primary"
              style="text-decoration: none; text-align: center; display: block"
            >
              START MISSION
            </a>
            {% else %}
            <button
              class="btn-neon"
              disabled
              style="
                width: 100%;
                background: #333;
                color: #666;
                border-color: #444;
                cursor: not-allowed;
              "
            >
              LOCKED <i class="fas fa-lock"></i>
            </button>
            {% endif %}
          </div>
        </div>
        {% endfor %}
      </div>

      <div style="margin-top: 3rem">
        <a href="{{ url_for('main.dashboard') }}" class="link-text">
          <i class="fas fa-arrow-left"></i> BACK TO DASHBOARD
        </a>
      </div>
    </div>
  </body>
</html>
