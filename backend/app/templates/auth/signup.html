<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - The Lost Spectrum</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <div class="glass-panel" style="max-width: 400px; width: 100%;">
    <div class="text-center mb-4">
      <h1 class="brand-title" style="margin-bottom: 0.5rem;">SIGN UP</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">JOIN THE ADVENTURE</p>
    </div>

    <form id="signupForm">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <input type="text" id="username" name="username" required placeholder="HeroName">
          <i class="fas fa-user input-icon"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <input type="email" id="email" name="email" required placeholder="hero@realm.com">
          <i class="fas fa-envelope input-icon"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password" required placeholder="••••••••"
            style="padding-right: 2.5rem;">
          <i class="fas fa-eye input-icon toggle-password" onclick="togglePassword('password', this)"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <div class="input-wrapper">
          <input type="password" id="confirm_password" name="confirm_password" required placeholder="••••••••"
            style="padding-right: 2.5rem;">
          <i class="fas fa-eye input-icon toggle-password" onclick="togglePassword('confirm_password', this)"></i>
        </div>
      </div>

      <div id="statusMessage" class="helper-text" style="color: var(--accent-pink);"></div>

      <button type="submit" class="btn-neon btn-primary">
        CREATE ACCOUNT
      </button>
    </form>

    <div class="text-center mt-4">
      <p class="helper-text">
        Already have an account? <a href="{{ url_for('auth.login_page') }}" class="link-text">Sign In</a>
      </p>
    </div>
  </div>

  <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm_password').value;
      const status = document.getElementById('statusMessage');
      const btn = e.target.querySelector('button');

      if (password !== confirmPassword) {
        status.innerText = 'Passwords do not match';
        status.style.color = 'var(--accent-pink)';
        return;
      }

      try {
        btn.disabled = true;
        btn.innerText = 'CREATING...';
        status.innerText = '';
        status.style.color = 'var(--accent-pink)';

        const response = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });

        const data = await response.json();

        if (data.success) {
          status.style.color = 'var(--primary-cyan)';
          status.innerText = 'Account Created! Redirecting...';
          setTimeout(() => {
            window.location.href = '{{ url_for("auth.login_page") }}';
          }, 2000);
        } else {
          status.innerText = data.message;
          btn.disabled = false;
          btn.innerText = 'CREATE ACCOUNT';
        }
      } catch (error) {
        status.innerText = 'Connection Error';
        btn.disabled = false;
        btn.innerText = 'CREATE ACCOUNT';
      }
    });

    function togglePassword(inputId, icon) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }
  </script>
</body>

</html>
