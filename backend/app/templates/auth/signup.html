<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - The Lost Spectrum</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="auth-bg">
      <img
        src="{{ url_for('static', filename='images/bg-auth.png') }}"
        alt=""
      />
    </div>

    <div class="glass-panel" style="max-width: 420px; width: 100%">
      <div class="text-center mb-4">
        <div class="logo-icon">
          <i class="fas fa-scroll"></i>
        </div>
        <h1 class="brand-title">JOIN THE ORDER</h1>
        <p class="subtitle">Inscribe your name in the ancient archives.</p>
      </div>

      <form id="signupForm">
        <div class="form-group">
          <label for="username">Chosen Name</label>
          <div class="input-wrapper">
            <i class="fas fa-hat-wizard input-icon left"></i>
            <input
              type="text"
              id="username"
              name="username"
              required
              placeholder="Ex: Merlin_The_Wise"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="email">Runic Mail</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope input-icon left"></i>
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="mage@realm.com"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Secret Incantation</label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon left"></i>
            <input
              type="password"
              id="password"
              name="password"
              required
              placeholder="••••••••"
              style="padding-right: 2.8rem"
            />
            <i
              class="fas fa-eye-slash input-icon right toggle-password"
              onclick="togglePassword('password', this)"
            ></i>
          </div>
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm Incantation</label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon left"></i>
            <input
              type="password"
              id="confirm_password"
              name="confirm_password"
              required
              placeholder="••••••••"
              style="padding-right: 2.8rem"
            />
            <i
              class="fas fa-eye-slash input-icon right toggle-password"
              onclick="togglePassword('confirm_password', this)"
            ></i>
          </div>
        </div>

        <div id="statusMessage" class="helper-text error-text"></div>

        <button type="submit" class="btn-neon btn-primary">
          <i class="fas fa-feather-alt btn-icon"></i> CREATE YOUR LEGACY
        </button>
      </form>

      <div class="text-center mt-4">
        <p class="helper-text">
          Already have an ID?
          <a href="{{ url_for('auth.login_page') }}" class="link-text"
            >Enter the Realm</a
          >
        </p>
      </div>
    </div>

    <div class="auth-footer">
      &copy; 2025 The Lost Spectrum. All rights reserved. Access to the archives
      is restricted to authorized personnel of the Grand Tower.
    </div>

    <script>
      document
        .getElementById("signupForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const name = document.getElementById("username").value;
          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
          const confirmPassword =
            document.getElementById("confirm_password").value;
          const status = document.getElementById("statusMessage");
          const btn = e.target.querySelector("button");

          if (password !== confirmPassword) {
            status.innerText = "Incantations do not match";
            status.className = "helper-text error-text";
            return;
          }

          try {
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> FORGING...';
            status.innerText = "";
            status.className = "helper-text error-text";

            const response = await fetch("/api/signup", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ name, email, password }),
            });

            const data = await response.json();

            if (data.success) {
              status.className = "helper-text success-text";
              status.innerText = "Account Forged! Redirecting to the gates...";
              setTimeout(() => {
                window.location.href = '{{ url_for("auth.login_page") }}';
              }, 2000);
            } else {
              status.innerText = data.message;
              btn.disabled = false;
              btn.innerHTML =
                '<i class="fas fa-feather-alt btn-icon"></i> CREATE YOUR LEGACY';
            }
          } catch (error) {
            status.innerText = "The void consumed your request";
            btn.disabled = false;
            btn.innerHTML =
              '<i class="fas fa-feather-alt btn-icon"></i> CREATE YOUR LEGACY';
          }
        });

      function togglePassword(inputId, icon) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
          input.type = "text";
          icon.classList.remove("fa-eye-slash");
          icon.classList.add("fa-eye");
        } else {
          input.type = "password";
          icon.classList.remove("fa-eye");
          icon.classList.add("fa-eye-slash");
        }
      }
    </script>
  </body>
</html>
