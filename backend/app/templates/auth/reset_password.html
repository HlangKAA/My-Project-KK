<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - The Lost Spectrum</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <div class="glass-panel" style="max-width: 400px; width: 100%;">
    <div class="text-center mb-4">
      <h1 class="brand-title" style="margin-bottom: 0.5rem; font-size: 1.8rem;">NEW KEY</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">SECURE YOUR ACCOUNT</p>
    </div>

    <form id="resetForm">
      <input type="hidden" id="token" value="{{ token }}">

      <div class="form-group">
        <label for="password">New Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password" required placeholder="••••••••">
          <i class="fas fa-eye input-icon toggle-password" onclick="togglePassword('password', this)"></i>
        </div>
      </div>

      <div id="statusMessage" class="helper-text" style="color: var(--accent-pink);"></div>

      <button type="submit" class="btn-neon btn-primary">
        UPDATE PASSWORD
      </button>
    </form>
  </div>

  <script>
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = document.getElementById('token').value;
      const password = document.getElementById('password').value;
      const status = document.getElementById('statusMessage');
      const btn = e.target.querySelector('button');

      try {
        btn.disabled = true;
        btn.innerText = 'UPDATING...';
        status.innerText = '';
        status.style.color = 'var(--accent-pink)';

        const response = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });

        const data = await response.json();

        if (data.success) {
          status.style.color = 'var(--primary-cyan)';
          status.innerText = 'Password Reset! Redirecting...';
          setTimeout(() => {
            window.location.href = '{{ url_for("auth.login_page") }}';
          }, 2000);
        } else {
          status.innerText = data.message;
          btn.disabled = false;
          btn.innerText = 'UPDATE PASSWORD';
        }
      } catch (error) {
        status.innerText = 'Connection Error';
        btn.disabled = false;
        btn.innerText = 'UPDATE PASSWORD';
      }
    });

    function togglePassword(inputId, icon) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }
  </script>
</body>

</html>
