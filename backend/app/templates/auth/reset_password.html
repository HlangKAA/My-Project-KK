<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - The Lost Spectrum</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="auth-bg">
      <img
        src="{{ url_for('static', filename='images/bg-auth.png') }}"
        alt=""
      />
    </div>

    <div class="glass-panel" style="max-width: 420px; width: 100%">
      <div class="text-center mb-4">
        <div class="logo-icon">
          <i class="fas fa-hammer"></i>
        </div>
        <h1 class="brand-title" style="font-size: 1.6rem">FORGE NEW KEY</h1>
        <p class="subtitle">Seal your new incantation into the archives.</p>
      </div>

      <form id="resetForm">
        <input type="hidden" id="token" value="{{ token }}" />

        <div class="form-group">
          <label for="password">New Incantation</label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon left"></i>
            <input
              type="password"
              id="password"
              name="password"
              required
              placeholder="••••••••"
              style="padding-right: 2.8rem"
            />
            <i
              class="fas fa-eye-slash input-icon right toggle-password"
              onclick="togglePassword('password', this)"
            ></i>
          </div>
        </div>

        <div id="statusMessage" class="helper-text error-text"></div>

        <button type="submit" class="btn-neon btn-primary">
          <i class="fas fa-fire btn-icon"></i> SEAL THE PACT
        </button>
      </form>
    </div>

    <div class="auth-footer">
      &copy; 2025 The Lost Spectrum. All rights reserved.
    </div>

    <script>
      document
        .getElementById("resetForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const token = document.getElementById("token").value;
          const password = document.getElementById("password").value;
          const status = document.getElementById("statusMessage");
          const btn = e.target.querySelector("button");

          try {
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> FORGING...';
            status.innerText = "";
            status.className = "helper-text error-text";

            const response = await fetch("/api/reset-password", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token, password }),
            });

            const data = await response.json();

            if (data.success) {
              status.className = "helper-text success-text";
              status.innerText = "Key forged! Returning to the gates...";
              setTimeout(() => {
                window.location.href = '{{ url_for("auth.login_page") }}';
              }, 2000);
            } else {
              status.innerText = data.message;
              btn.disabled = false;
              btn.innerHTML =
                '<i class="fas fa-fire btn-icon"></i> SEAL THE PACT';
            }
          } catch (error) {
            status.innerText = "The void consumed your request";
            btn.disabled = false;
            btn.innerHTML =
              '<i class="fas fa-fire btn-icon"></i> SEAL THE PACT';
          }
        });

      function togglePassword(inputId, icon) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
          input.type = "text";
          icon.classList.remove("fa-eye-slash");
          icon.classList.add("fa-eye");
        } else {
          input.type = "password";
          icon.classList.remove("fa-eye");
          icon.classList.add("fa-eye-slash");
        }
      }
    </script>
  </body>
</html>
