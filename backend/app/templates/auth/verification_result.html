<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification - The Lost Spectrum</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <div class="glass-panel" style="max-width: 450px; width: 100%; text-align: center;">
    {% if success %}
    <i class="fas fa-check-circle"
      style="font-size: 4rem; color: var(--primary-cyan); margin-bottom: 1.5rem; text-shadow: var(--neon-glow-cyan);"></i>
    <h1 class="brand-title" style="margin-bottom: 1rem;">VERIFIED</h1>
    <p style="color: var(--text-main); margin-bottom: 2rem;">{{ message }}</p>

    <a href="{{ url_for('auth.login_page') }}" class="btn-neon btn-primary"
      style="display: block; text-decoration: none;">
      ENTER THE GAME
    </a>
    {% else %}
    <i class="fas fa-times-circle" style="font-size: 4rem; color: var(--accent-pink); margin-bottom: 1.5rem;"></i>
    <h1 style="color: var(--accent-pink); margin-bottom: 1rem;">FAILED</h1>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">{{ message }}</p>

    {% if expired and email %}
    <button onclick="resendVerification()" id="resendBtn" class="btn-neon btn-secondary">
      RESEND LINK
    </button>
    <div id="resendMessage" class="helper-text mt-4"></div>
    <script>
      async function resendVerification() {
        const btn = document.getElementById('resendBtn');
        const msg = document.getElementById('resendMessage');
        const email = '{{ email }}';

        btn.disabled = true;
        btn.innerText = 'SENDING...';

        try {
          const response = await fetch('/resend-verification', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const data = await response.json();
          msg.innerText = data.message;
          msg.style.color = data.success ? 'var(--primary-cyan)' : 'var(--accent-pink)';
        } catch (e) {
          msg.innerText = 'Error sending request';
        }
        btn.disabled = false;
        btn.innerText = 'RESEND LINK';
      }
    </script>
    {% else %}
    <a href="{{ url_for('auth.signup_page') }}" class="btn-neon btn-secondary"
      style="display: block; text-decoration: none;">
      BACK TO SIGN UP
    </a>
    {% endif %}
    {% endif %}
  </div>
</body>

</html>
