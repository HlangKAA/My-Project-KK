<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Verification - The Lost Spectrum</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      body { background: #15130f; color: #f3e7d0; }
      .glass-panel { background: rgba(30, 29, 24, .94); border: 1px solid rgba(184, 137, 73, .4); }
      .brand-title { color: #f3e7d0; }
      .logo-icon { background: #b88949; color: #1e1d18; box-shadow: 0 0 20px rgba(184, 137, 73, .35); }
      .gold-action { display: block; margin-top: 1rem; padding: .9rem 1.2rem; border: 1px solid #d0a55f; border-radius: 6px; background: #b88949; color: #1e1d18; font-weight: 700; text-decoration: none; }
      .gold-link { color: #d0a55f; }
      .status { color: #c2b49e; line-height: 1.6; }
      .status-error { color: #e2a18c; }
      .form-group input { width: 100%; }
      .helper-text { margin-top: .8rem; }
    </style>
  </head>
  <body>
    <div class="auth-bg"><img src="{{ url_for('static', filename='images/bg-auth.png') }}" alt="" /></div>
    <main class="glass-panel" style="max-width: 450px; width: 100%; text-align: center">
      <div class="logo-icon"><i class="fas {{ 'fa-shield-alt' if success else 'fa-scroll' }}"></i></div>
      <h1 class="brand-title" style="font-size: 1.8rem">{{ 'EMAIL VERIFIED' if success else 'VERIFICATION PENDING' }}</h1>
      <p class="status {{ 'status-error' if not success else '' }}">{{ message }}</p>

      {% if expired and email %}
      <form id="resendForm" class="form-group" style="text-align: left; margin-top: 1.5rem">
        <label for="email">Runic Mail</label>
        <input id="email" name="email" type="email" value="{{ email }}" required />
        <button id="resendBtn" type="submit" class="gold-action"><i class="fas fa-redo"></i> RESEND VERIFICATION</button>
        <p id="resendMessage" class="status" role="status"></p>
      </form>
      {% endif %}

      <a href="{{ config['FRONTEND_URL'] }}/login" class="gold-action"><i class="fas fa-dungeon"></i> RETURN TO LOGIN</a>
      {% if not success %}
      <p class="status">Need an account? <a class="gold-link" href="{{ config['FRONTEND_URL'] }}/register">Return to registration</a></p>
      {% endif %}
    </main>
    <footer class="auth-footer">&copy; 2025 The Lost Spectrum. All rights reserved.</footer>
    {% if expired and email %}
    <script>
      document.getElementById('resendForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const button = document.getElementById('resendBtn');
        const message = document.getElementById('resendMessage');
        button.disabled = true;
        message.textContent = 'Sending a new verification link...';
        try {
          const response = await fetch('/api/resend-verification', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: document.getElementById('email').value })
          });
          const result = await response.json();
          message.textContent = result.message || 'Please try again later.';
        } catch {
          message.textContent = 'Could not send the email. Please try again later.';
        } finally {
          button.disabled = false;
        }
      });
    </script>
    {% endif %}
  </body>
</html>
