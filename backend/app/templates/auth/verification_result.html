<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verification - The Lost Spectrum</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="auth-bg">
      <img
        src="{{ url_for('static', filename='images/bg-auth.png') }}"
        alt=""
      />
    </div>

    <div
      class="glass-panel"
      style="max-width: 450px; width: 100%; text-align: center"
    >
      {% if success %}
      <div
        class="logo-icon"
        style="background: #16a34a; box-shadow: 0 0 20px rgba(22, 163, 74, 0.4)"
      >
        <i class="fas fa-shield-alt"></i>
      </div>
      <h1 class="brand-title" style="font-size: 1.8rem">VERIFIED</h1>
      <p class="subtitle" style="margin-bottom: 2rem">{{ message }}</p>

      <a
        href="http://localhost:5173/login"
        class="btn-neon btn-primary"
        style="display: block; text-decoration: none; text-align: center"
      >
        <i class="fas fa-dungeon btn-icon"></i> ENTER THE GAME
      </a>
      {% else %}
      <div class="logo-icon" style="background: #dc2626">
        <i class="fas fa-skull-crossbones"></i>
      </div>
      <h1 class="brand-title" style="font-size: 1.8rem; color: #f87171">
        FAILED
      </h1>
      <p style="color: var(--text-muted); margin-bottom: 2rem">{{ message }}</p>

      {% if expired and email %}
      <button
        onclick="resendVerification()"
        id="resendBtn"
        class="btn-neon btn-secondary"
      >
        <i class="fas fa-redo btn-icon"></i> RESEND SPELL
      </button>
      <div id="resendMessage" class="helper-text mt-4"></div>
      <script>
        async function resendVerification() {
          const btn = document.getElementById("resendBtn");
          const msg = document.getElementById("resendMessage");
          const email = "{{ email }}";

          btn.disabled = true;
          btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> CASTING...';

          try {
            const response = await fetch("/resend-verification", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email }),
            });
            const data = await response.json();
            msg.innerText = data.message;
            msg.className = data.success
              ? "helper-text success-text mt-4"
              : "helper-text error-text mt-4";
          } catch (e) {
            msg.innerText = "The void consumed your request";
            msg.className = "helper-text error-text mt-4";
          }
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-redo btn-icon"></i> RESEND SPELL';
        }
      </script>
      {% else %}
      <a
        href="{{ url_for('auth.signup_page') }}"
        class="btn-neon btn-secondary"
        style="display: block; text-decoration: none; text-align: center"
      >
        <i class="fas fa-arrow-left btn-icon"></i> BACK TO SIGN UP
      </a>
      {% endif %} {% endif %}
    </div>

    <div class="auth-footer">
      &copy; 2025 The Lost Spectrum. All rights reserved.
    </div>
  </body>
</html>
