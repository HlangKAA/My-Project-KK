<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - The Lost Spectrum</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="auth-bg">
      <img
        src="{{ url_for('static', filename='images/bg-auth.png') }}"
        alt=""
      />
    </div>

    <div class="glass-panel" style="max-width: 420px; width: 100%">
      <div class="text-center mb-4">
        <div class="logo-icon">
          <i class="fas fa-key"></i>
        </div>
        <h1 class="brand-title" style="font-size: 1.6rem">LOST YOUR KEY?</h1>
        <p class="subtitle">
          We shall send a recovery spell to your runic mail.
        </p>
      </div>

      <form id="forgotForm">
        <div class="form-group">
          <label for="email">Runic Mail Address</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope input-icon left"></i>
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="lost@realm.com"
            />
          </div>
        </div>

        <div id="statusMessage" class="helper-text error-text"></div>

        <button type="submit" class="btn-neon btn-primary">
          <i class="fas fa-magic btn-icon"></i> SEND RECOVERY SPELL
        </button>
      </form>

      <div class="text-center mt-4">
        <p class="helper-text">
          <a href="{{ url_for('auth.login_page') }}" class="link-text"
            ><i class="fas fa-arrow-left"></i> Back to the Gates</a
          >
        </p>
      </div>
    </div>

    <div class="auth-footer">
      &copy; 2025 The Lost Spectrum. All rights reserved.
    </div>

    <script>
      document
        .getElementById("forgotForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("email").value;
          const status = document.getElementById("statusMessage");
          const btn = e.target.querySelector("button");

          try {
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> CASTING...';
            status.innerText = "";
            status.className = "helper-text error-text";

            const response = await fetch("/api/forgot-password", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email }),
            });

            const data = await response.json();

            if (data.success) {
              status.className = "helper-text success-text";
              status.innerText =
                "A recovery spell has been sent to your runic mail.";
              btn.innerHTML = '<i class="fas fa-check"></i> SPELL SENT';
            } else {
              status.innerText = data.message;
              btn.disabled = false;
              btn.innerHTML =
                '<i class="fas fa-magic btn-icon"></i> SEND RECOVERY SPELL';
            }
          } catch (error) {
            status.innerText = "The void consumed your request";
            btn.disabled = false;
            btn.innerHTML =
              '<i class="fas fa-magic btn-icon"></i> SEND RECOVERY SPELL';
          }
        });
    </script>
  </body>
</html>
