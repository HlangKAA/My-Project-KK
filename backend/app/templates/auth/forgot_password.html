<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - The Lost Spectrum</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <div class="glass-panel" style="max-width: 400px; width: 100%;">
    <div class="text-center mb-4">
      <h1 class="brand-title" style="margin-bottom: 0.5rem; font-size: 1.8rem;">RECOVERY</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">RESTORE YOUR ACCESS</p>
    </div>

    <form id="forgotForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <input type="email" id="email" name="email" required placeholder="lost@void.com">
          <i class="fas fa-envelope input-icon"></i>
        </div>
      </div>

      <div id="statusMessage" class="helper-text" style="color: var(--accent-pink);"></div>

      <button type="submit" class="btn-neon btn-primary">
        SEND RESET LINK
      </button>
    </form>

    <div class="text-center mt-4">
      <p class="helper-text">
        <a href="{{ url_for('auth.login_page') }}" class="link-text">Back to Login</a>
      </p>
    </div>
  </div>

  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const status = document.getElementById('statusMessage');
      const btn = e.target.querySelector('button');

      try {
        btn.disabled = true;
        btn.innerText = 'SENDING...';
        status.innerText = '';
        status.style.color = 'var(--accent-pink)';

        const response = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (data.success) {
          status.style.color = 'var(--primary-cyan)';
          status.innerText = 'Check your email for the reset link.';
          btn.innerText = 'LINK SENT';
        } else {
          status.innerText = data.message;
          btn.disabled = false;
          btn.innerText = 'SEND RESET LINK';
        }
      } catch (error) {
        status.innerText = 'Connection Error';
        btn.disabled = false;
        btn.innerText = 'SEND RESET LINK';
      }
    });
  </script>
</body>

</html>
